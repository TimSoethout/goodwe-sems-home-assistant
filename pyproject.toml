[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
asyncio_mode = "auto"
filterwarnings = [
	# Home Assistant overrides aiohttp.web.Application by design.
	"ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning:homeassistant[.]components[.]http[.]server",
	# https://github.com/litl/backoff/pull/220 - no release containing the fix
	"ignore:'asyncio[.]iscoroutinefunction' is deprecated and slated for removal in Python 3[.]16; use inspect[.]iscoroutinefunction[()][()] instead:DeprecationWarning:backoff[.].*",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
	".venv",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
	"E",
	"F",
	"W",
	"I",
	"B",
	"UP",
	"ASYNC",
	"RUF",
]
ignore = [
	"E501",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.sems"]

[tool.mypy]
python_version = "3.14"
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["custom_components/sems"]

[tool.coverage.report]
show_missing = true
skip_covered = true
