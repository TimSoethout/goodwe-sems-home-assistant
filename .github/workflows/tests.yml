name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    # branches: [ main, master ]
  schedule:
    # Run tests daily at 6 AM UTC to catch dependency issues
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip'
        cache-dependency-path: '**/requirements.test.txt'

    - name: Install dependencies
      run: python -m pip install -r requirements.test.txt

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=custom_components.sems \
          --cov-report=xml --cov-report=term-missing \
          --cov-fail-under=80 --junitxml=./junit.xml -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: ${{ !cancelled() }}
      with:
        files: ./coverage.xml
        fail_ci_if_error: true
        use_oidc: true
        verbose: true

    - name: Upload test results to Codecov
      uses: codecov/codecov-action@v7
      if: ${{ !cancelled() }}
      with:
        files: ./junit.xml
        report_type: test_results
        fail_ci_if_error: true
        use_oidc: true
        verbose: true

  lint:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip'
        cache-dependency-path: '**/requirements.test.txt'

    - name: Install linting dependencies
      run: |
        python -m pip install -r requirements.test.txt \
          ruff mypy

    - name: Run ruff (lint)
      run: ruff check custom_components/

    - name: Run ruff (format check)
      run: ruff format --check custom_components/

    - name: Run mypy (check)
      run: mypy custom_components/ --ignore-missing-imports --python-version 3.14

  validate:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate with hassfest
      uses: home-assistant/actions/hassfest@master

    - name: Validate with HACS
      uses: hacs/action@main
      with:
        category: integration
