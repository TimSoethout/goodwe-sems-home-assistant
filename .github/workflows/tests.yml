name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    # branches: [ main, master ]
  schedule:
    # Run tests daily at 6 AM UTC to catch dependency issues
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip'
        cache-dependency-path: '**/requirements.test.txt'

    - name: Install dependencies
      run: python -m pip install -r requirements.test.txt

    - name: Run tests
      if: github.event_name == 'pull_request'
      run: pytest tests/ -v

    - name: Run tests with coverage
      if: github.event_name != 'pull_request'
      run: |
        pytest tests/ --cov=custom_components.sems \
          --cov-report=xml --cov-report=term-missing -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: github.event_name != 'pull_request'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true

  lint:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip'
        cache-dependency-path: '**/requirements.test.txt'

    - name: Install linting dependencies
      run: |
        python -m pip install -r requirements.test.txt \
          ruff mypy

    - name: Run ruff (lint)
      run: ruff check custom_components/

    - name: Run ruff (format check)
      run: ruff format --check custom_components/

    - name: Run mypy (check)
      run: mypy custom_components/ --ignore-missing-imports --python-version 3.14

  validate:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate with hassfest
      uses: home-assistant/actions/hassfest@master

    - name: Validate with HACS
      uses: hacs/action@main
      with:
        category: integration
