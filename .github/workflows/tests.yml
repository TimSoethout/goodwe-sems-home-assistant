name: Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "api_examples/**"
      - "scripts/**"
      - ".github/workflows/quality-scale-report.yml"
      - "requirements*.txt"
      - "pyproject.toml"
      - "hacs.json"
      - ".codecov.yml"
      - ".github/workflows/tests.yml"
  pull_request:
    # branches: [ main, master ]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "api_examples/**"
      - "scripts/**"
      - ".github/workflows/quality-scale-report.yml"
      - "requirements*.txt"
      - "pyproject.toml"
      - "hacs.json"
      - ".codecov.yml"
      - ".github/workflows/tests.yml"
  schedule:
    # Run tests daily at 6 AM UTC to catch dependency issues
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Test quality-scale report publisher
      run: node --test scripts/publish_quality_scale_report.test.js

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true
        cache-dependency-glob: requirements.test.txt

    - name: Install dependencies
      run: uv pip install --system -r requirements.test.txt

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=custom_components.sems \
          --cov-report=xml --cov-report=term-missing \
          --cov-report=json:coverage.json \
          --cov-fail-under=80 --junitxml=./junit.xml

    - name: Report HA quality-scale coverage checks
      if: always()
      continue-on-error: true
      run: bash scripts/report_quality_scale_coverage.sh

    - name: Enforce HA quality-scale coverage
      if: success()
      run: |
        jq -e '
          .bronze.available == true
          and (.bronze.total | type == "number" and . > 0)
          and .bronze.covered == .bronze.total
          and .silver.available == true
          and (.silver.modules | type == "number" and . > 0)
          and .silver.below == 0
        ' quality-scale-coverage.json > /dev/null

    - name: Upload quality-scale coverage report
      if: ${{ always() && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: quality-scale-coverage
        path: quality-scale-coverage.json
        if-no-files-found: warn
        retention-days: 1

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: ${{ !cancelled() }}
      with:
        files: ./coverage.xml
        fail_ci_if_error: true
        use_oidc: true
        verbose: false

    - name: Upload test results to Codecov
      uses: codecov/codecov-action@v7
      if: ${{ !cancelled() }}
      with:
        files: ./junit.xml
        report_type: test_results
        fail_ci_if_error: true
        use_oidc: true
        verbose: false

  lint:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true
        cache-dependency-glob: requirements.lint.txt

    - name: Install linting dependencies
      run: uv pip install --system -r requirements.lint.txt

    - name: Run ruff (lint)
      run: ruff check custom_components/

    - name: Run ruff (format check)
      run: ruff format --check custom_components/

    - name: Run mypy (check)
      run: mypy custom_components/ --ignore-missing-imports --python-version 3.14

    - name: Report Platinum strict-typing check
      if: always()
      continue-on-error: true
      run: bash scripts/report_quality_scale_strict_typing.sh

    - name: Enforce Platinum strict typing
      if: success()
      run: |
        jq -e '.available == true and .passed == true' \
          quality-scale-strict-typing.json > /dev/null

    - name: Upload quality-scale strict-typing report
      if: ${{ always() && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: quality-scale-strict-typing
        path: quality-scale-strict-typing.json
        if-no-files-found: warn
        retention-days: 1

  validate:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate with hassfest
      uses: home-assistant/actions/hassfest@master

    - name: Validate with HACS
      uses: hacs/action@main
      with:
        category: integration
