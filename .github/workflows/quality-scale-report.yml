name: Quality scale PR report

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted reporting script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download quality-scale reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          pattern: quality-scale-*
          merge-multiple: true
          path: quality-scale-reports

      - name: Update PR summary comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const publish = require(`${process.env.GITHUB_WORKSPACE}/scripts/publish_quality_scale_report.js`);
            await publish({ github, context, core });
